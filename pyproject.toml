[project]
name = "options-funnel"
version = "0.1.0"
description = "Measures the Radar to Options selection funnel (research only, no orders)"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".wt-tree", "var"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
